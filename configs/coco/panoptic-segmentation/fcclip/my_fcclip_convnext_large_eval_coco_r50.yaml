_BASE_: ./fcclip_convnext_large_eval_ade20k.yaml
MODEL:
  META_ARCHITECTURE: "MYFCCLIP"
  # backbone part.
  BACKBONE:
    NAME: "CLIP"
    FREEZE: False
  FC_CLIP:
    CLIP_MODEL_NAME: "RN50"
    CLIP_PRETRAINED_WEIGHTS: "openai"
    SEM_SEG_WEIGHTS: "/home/nikolay/fcclip_cocopan_r50.pth"
    EMBED_DIM: 1024
    ENSEMBLE_ON_VALID_MASK: True
    USE_POOLING_WEIGHTS: False
    DIST_WEIGHT: 0.02
    CE_WEIGHT: 2.0
    LOSS: "l2"
    DIST_WARMUP_ITERS: 0
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.0001
  STEPS: (15000, 17500)
  MAX_ITER: 20000
  WARMUP_FACTOR: 1.0
  WARMUP_ITERS: 10
  WEIGHT_DECAY: 0.05
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 0.1
  CHECKPOINT_PERIOD: 4000
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
  AMP:
    ENABLED: False
TRAIN:
  LOSSES:
    - "oov_ce"
    - "masks"
    - "labels"
  WITH_FC_CLIP_MASKS: True
  SEG_HEAD: True # Requires WITH_FC_CLIP_MASKS
  USE_TUNED_FEATURES_FOR_SEG_HEAD: True
  DETACH_SEG_HEAD: False
TEST:
  PERFECT_MASKS: False
  WITH_VOID: False
  WITH_FC_CLIP: True
  EVAL_PERIOD: 4000
DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: True
  NUM_WORKERS: 2
DATASETS:
  TEST: ("openvocab_coco_2017_val_panoptic_with_sem_seg",)