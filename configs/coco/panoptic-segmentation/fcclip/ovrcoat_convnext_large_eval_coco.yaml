_BASE_: ./fcclip_convnext_large_eval_ade20k.yaml
MODEL:
  META_ARCHITECTURE: "OVRCOAT"
  # backbone part.
  BACKBONE:
    NAME: "CLIP"
    FREEZE: False
  FC_CLIP:
    CLIP_MODEL_NAME: "convnext_large_d_320"
    CLIP_PRETRAINED_WEIGHTS: "laion2b_s29b_b131k_ft_soup"
    EMBED_DIM: 768
    GEOMETRIC_ENSEMBLE_ALPHA: 0.4
    GEOMETRIC_ENSEMBLE_BETA: 0.8
  OVRCOAT:
    CE_WEIGHT: 2.0
    DIST_WEIGHT: 0.02
    RC_WEIGHTS: 0.0
    CLIP_TRUST_WEIGHT: 0.5
    SEM_SEG_WEIGHTS: "/home/nikolay/fcclip_cocopan.pth"
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.0001
  #STEPS: (7000, 355092)
  #MAX_ITER: 368750
  MAX_ITER: 100000
  POLY_LR_POWER: 2.0
  WARMUP_FACTOR: 1.0
  WARMUP_ITERS: 10
  WEIGHT_DECAY: 0.05
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 0.1
  CHECKPOINT_PERIOD: 1000
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
  AMP:
    ENABLED: True
TRAIN:
  LOSSES: # Works only with WITH_FC_CLIP_MASKS: True . For GT masks we always use oov ce and the clip comparison loss
    - "oov_ce"
    #- "ma_loss"
    - "masks"
    - "labels"
  USE_PRETRAINED_SEG_HEAD_WEIGHTS: False # Load FC-Clip weights for the segmentation head at init
  DETACH_SEG_HEAD: False # Detach the segmentation head from the Clip backbone
TEST:
  EVAL_PERIOD: 1000
DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: True
  NUM_WORKERS: 2
DATASETS:
  #TEST: ("openvocab_coco_2017_val_panoptic_with_sem_seg",)
  #TEST: ("openvocab_ade20k_full_sem_seg_val",)
  TEST: ("openvocab_ade20k_panoptic_val",)
  #TEST: ("openvocab_pascal_ctx459_sem_seg_val",)
  #TEST: ("openvocab_pascal_ctx59_sem_seg_val",)
  #TEST: ("openvocab_pascal20_sem_seg_val",)
  #TEST: ("openvocab_cityscapes_fine_panoptic_val",)